spring.main.web-application-type=none
logging.level.org.springframework = ERROR
spring.main.allow-circular-references = false
com.sun.javafx.application.PlatformImpl#startup(Runnable)

# Hibernate configuration
spring.jpa.database-platform=com.cypods.geBuddy.SQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Logging configuration
logging.level.root=ERROR


# Database configuration when using Environment variables
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.datasource.url=jdbc:sqlite:spring.db
username=admin
password=admin
